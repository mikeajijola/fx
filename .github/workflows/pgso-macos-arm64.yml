name: PGSO size experiments
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: pgso-size-experiments-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
env:
  FX_SOUND: "0"
jobs:
  compare:
    name: Compare ${{ matrix.mode }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [globals]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup pinned tools
        id: setup
        uses: ./.github/actions/setup-pgso
        with:
          llvm: "true"
      - name: Download retained seed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pgso-seed-b6d78488dd1939475f91b3d31e4b8c9b61d98f21-attempt-1
          run-id: 39257938998
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/seed
      - name: Download retained production profile
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pgso-candidate-b6d78488dd1939475f91b3d31e4b8c9b61d98f21-attempt-1
          run-id: 39257938998
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained
      - name: Download pinned retained IR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pgso-size-comparison-finish
          run-id: 39293908195
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prepared
      - name: Compare immutable inputs without release eligibility
        run: >-
          python3 -m scripts.pgso.size_experiment
          --seed "$RUNNER_TEMP/seed"
          --retained "$RUNNER_TEMP/retained"
          --output "$RUNNER_TEMP/comparison"
          --llvm-bin "${{ steps.setup.outputs.llvm-bin }}"
          --mode "${{ matrix.mode }}"
          --prepared "$RUNNER_TEMP/prepared"
      - name: Upload comparison only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pgso-size-comparison-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/comparison/comparison.json
            ${{ runner.temp }}/comparison/routing.json
            ${{ runner.temp }}/comparison/logs
            ${{ runner.temp }}/comparison/*-fx
            ${{ runner.temp }}/comparison/*-pass.bc
            ${{ runner.temp }}/comparison/candidate/fx.bc
            ${{ runner.temp }}/comparison/candidate/fx.o
          if-no-files-found: warn
