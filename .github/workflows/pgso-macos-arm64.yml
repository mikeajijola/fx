name: Native inlining size comparison
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: omos-inlining-comparison-${{ github.ref }}
  cancel-in-progress: true
env:
  FX_SOUND: "0"
jobs:
  compare:
    name: Compare ${{ matrix.variant }} inlining
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [capped, small]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3d265ae698c400785ea0c011f02659d9da4d0ed9
          fetch-depth: 0
      - name: Require native ARM64
        run: test "$(uname -m)" = arm64
      - name: Setup pinned tools
        id: setup
        uses: ./.github/actions/setup-pgso
        with:
          llvm: "true"
      - name: Download immutable seed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 12308325400
          run-id: 39514284334
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/seed
      - name: Download retained profiles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 12311183066
          run-id: 39514284334
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/retained
      - name: Measure inlining policy
        env:
          LLVM_BIN: ${{ steps.setup.outputs.llvm-bin }}
          VARIANT: ${{ matrix.variant }}
        run: |
          chmod +x "$RUNNER_TEMP/seed/control/bin/fx"
          python3 - <<'PY'
          import json,os,pathlib,shutil,subprocess
          from scripts.pgso import pipeline as p
          from scripts.pgso.model import sha256_file
          from scripts.pgso.toolchain import Toolchain
          root=pathlib.Path(os.environ['RUNNER_TEMP']);seed=root/'seed';retained=root/'retained'
          manifest=json.loads((seed/'manifest.json').read_text());identity=manifest['evidence']['identity']
          assert identity['source_sha']=='3d265ae698c400785ea0c011f02659d9da4d0ed9'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==identity['source_sha']
          bitcode=seed/'ir/pgso/fx.bc';profile=retained/'profiles/merged.profdata'
          assert sha256_file(bitcode)==identity['bitcode_sha256']=='c73a79f7b9d16aa8c8352478c58a9468e7bea48e779c58ce3c4ddeab99e714c4'
          assert sha256_file(profile)=='f3be6b347143b25664c1bf1c352860d4f9e4d3c2ed55744465fd703c8531aa32'
          assert sha256_file(seed/'control/bin/fx')==manifest['evidence']['control']['sha256']
          toolchain=Toolchain.discover('zig',os.environ['LLVM_BIN'],identity['target'])
          assert toolchain.llvm_version==identity['llvm_version']=='22.1.8'
          assert toolchain.zig_version==identity['zig_version']=='0.17.0'
          paths=p.PipelinePaths.create(root/'comparison')
          paths.control_binary.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy2(bitcode,paths.bitcode);shutil.copy2(profile,paths.merged_profile);shutil.copy2(seed/'control/bin/fx',paths.control_binary)
          variant=os.environ['VARIANT']
          if variant=='capped':extra=('-inline-threshold=100','-hot-callsite-threshold=500')
          elif variant=='small':extra=('-inline-threshold=50','-hot-callsite-threshold=100')
          else:raise ValueError('Unknown comparison variant')
          p.USE_FLAGS=(*p.USE_FLAGS,*extra)
          p.apply_profile(toolchain,paths,identity['bitcode_sha256']);p.link_candidate(toolchain,paths)
          for arg in ['--version','--help']:
              result=subprocess.run([str(paths.candidate_binary),arg],capture_output=True,text=True,check=True)
              assert not result.stderr,result.stderr
          report={'comparison_only':True,'eligible_for_release':False,'variant':variant,'identity':identity,'profile_sha256':sha256_file(profile),'baseline_bytes':7265472,'bytes':paths.candidate_binary.stat().st_size,'sha256':sha256_file(paths.candidate_binary),'use_flags':p.USE_FLAGS}
          (paths.root/'comparison.json').write_text(json.dumps(report,indent=2));print(json.dumps(report),flush=True)
          PY
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omos-inline-comparison-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/comparison/comparison.json
            ${{ runner.temp }}/comparison/logs
            ${{ runner.temp }}/comparison/candidate/fx
          if-no-files-found: warn
          retention-days: 14
